# ███████╗████████╗███████╗██████╗ ███╗   ██╗██╗████████╗██╗   ██╗
# ██╔════╝╚══██╔══╝██╔════╝██╔══██╗████╗  ██║██║╚══██╔══╝╚██╗ ██╔╝
# █████╗     ██║   █████╗  ██████╔╝██╔██╗ ██║██║   ██║    ╚████╔╝
# ██╔══╝     ██║   ██╔══╝  ██╔══██╗██║╚██╗██║██║   ██║     ╚██╔╝
# ██║        ██║   ███████╗██║  ██║██║ ╚████║██║   ██║      ██║
# ╚═╝        ╚═╝   ╚══════╝╚═╝  ╚═╝╚═╝  ╚═══╝╚═╝   ╚═╝      ╚═╝

source = ~/.config/hypr/colors.conf

# ── Background ────────────────────────────────────────────────────────────
# Captures the current screen and blurs it into a dreamlike backdrop.
# The fleeting moment before the lock — preserved, softened, suspended.

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.1
}

# ── Dark veil overlay ─────────────────────────────────────────────────────
# A translucent curtain drawn over the blurred moment so the
# elements above it read cleanly, regardless of what lies beneath.

shape {
    monitor =
    size = 100%, 100%
    color = $background_80
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# ── Time — bold, unhurried ────────────────────────────────────────────────
# The present moment, rendered at a scale that refuses to be ignored.
# 永遠 is not a destination — it is this, right now.

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $primary
    font_size = 72
    font_family = RobotoMono Nerd Font
    position = 0, -145
    halign = center
    valign = center
}

# ── Eternity divider ──────────────────────────────────────────────────────
# A line and a circle. The circle is eternity — the line is the path
# through fleeting moments that leads to it.

shape {
    monitor =
    size = 100, 1
    color = $on_surface
    rounding = 0
    position = 0, -87
    halign = center
    valign = center
}

shape {
    monitor =
    size = 6, 6
    color = $primary
    position = 0, -90
    halign = center
    valign = center
    rounding = 3
}

# ── Date ──────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:86400] echo "$(date +'%A, %d %B %Y')"
    color = $on_surface
    font_size = 16
    font_family = RobotoMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# ── Motif ─────────────────────────────────────────────────────────────────
# Euthymia — Ei's ideal of eternal stillness.
# Makima holds the leash.

label {
    monitor =
    text = Euthymia
    color = $error
    font_size = 14
    font_family = RobotoMono Nerd Font
    position = 0, -35
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────────────────────────
# The threshold between the lock and the world beyond.
# Coloured in hot pink and steel blue.

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = $secondary
    inner_color = $surface_container
    font_color = $on_surface
    fail_color = $error
    check_color = $tertiary
    placeholder_text = <i>Unlock...</i>
    position = 0, 80
    halign = center
    valign = center
}
