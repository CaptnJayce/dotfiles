# ── Background ────────────────────────────────────────────────────────────
# Captures the current screen and blurs it into a dreamlike backdrop.
# The fleeting moment before the lock — preserved, softened, suspended.

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.1
}

# ── Dark veil overlay ─────────────────────────────────────────────────────
# A translucent curtain drawn over the blurred moment so the
# elements above it read cleanly, regardless of what lies beneath.

shape {
    monitor =
    size = 100%, 100%
    color = rgba(0f0f1acc)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# ── Time — bold, unhurried ────────────────────────────────────────────────
# The present moment, rendered at a scale that refuses to be ignored.
# 永遠 is not a destination — it is this, right now.

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffb7c5ff)
    font_size = 72
    font_family = Terminess Nerd Font Mono
    position = 0, -145
    halign = center
    valign = center
}

# ── Eternity divider ──────────────────────────────────────────────────────
# A line and a circle. The circle is eternity — the line is the path
# through fleeting moments that leads to it.

shape {
    monitor =
    size = 100, 1
    color = rgba(9966ccff)
    rounding = 0
    position = 0, -87
    halign = center
    valign = center
}

shape {
    monitor =
    size = 6, 6
    color = rgba(ffb7c5ff)
    position = 0, -90
    halign = center
    valign = center
    rounding = 3
}

# ── Date ──────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:86400] echo "$(date +'%A, %d %B %Y')"
    color = rgba(9966ccff)
    font_size = 16
    font_family = Terminess Nerd Font Mono
    position = 0, -60
    halign = center
    valign = center
}

# ── Motif ─────────────────────────────────────────────────────────────────
# Euthymia — Ei's ideal of eternal stillness.
# Miko keeps the key, naturally.

label {
    monitor =
    text = Euthymia
    color = rgba(e05780ff)
    font_size = 14
    font_family = Terminess Nerd Font Mono
    position = 0, -35
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────────────────────────
# The threshold between the lock and the world beyond.
# Coloured in shrine-maiden purple and Sakura pink.

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(9966ccff)
    inner_color = rgba(151524ff)
    font_color = rgba(e8e8e8ff)
    fail_color = rgba(dc143cff)
    check_color = rgba(57c47fff)
    placeholder_text = <i>Unlock...</i>
    position = 0, 80
    halign = center
    valign = center
}
